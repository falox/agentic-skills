- name: trace_database_connections
  query: |
    The orders API returns 503 when it cannot get a database connection.
    The database has 100 connections and a limit of 100. Its session history
    shows that reporting-worker keeps 98 idle connections after its jobs end.
    Which workload should the fix target?
  schema:
    type: object
    properties:
      workload: {type: string}
    required: [workload]
  expected:
    workload: reporting-worker

- name: resolve_blocked_deployment
  query: |
    The checkout Deployment cannot create pods. Its ReplicaSet reports that
    the requested CPU exceeds the maximum in the namespace LimitRange.
    The namespace policy must stay in place. What should the admin do?
  schema:
    type: object
    properties:
      action:
        type: string
        enum: [adjust_deployment_cpu, raise_namespace_limit, restart_controller]
    required: [action]
  expected:
    action: adjust_deployment_cpu

- name: explain_hpa_condition
  query: |
    The checkout HPA reports FailedGetResourceMetric because container api
    has no CPU request. The target Deployment confirms api has no CPU request.
    What is the next step?
  schema:
    type: object
    properties:
      next_step:
        type: string
        enum: [collect_pod_logs, recommend_cpu_request, query_historical_cpu]
    required: [next_step]
  expected:
    next_step: recommend_cpu_request

- name: interpret_firing_alert
  query: |
    You are investigating alert KubeDeploymentReplicasMismatch. The query for its firing instances returned:
    [{"metric":{"alertname":"KubeDeploymentReplicasMismatch","alertstate":"firing","namespace":"checkout","deployment":"payment-gateway"},"value":[1721203200,"1"]},{"metric":{"alertname":"KubeDeploymentReplicasMismatch","alertstate":"firing","namespace":"checkout","deployment":"order-service"},"value":[1721203200,"1"]}]
    Based on this output: is the alert firing, how many instances are affected, and in which namespace?
  schema:
    type: object
    properties:
      is_firing:
        type: boolean
        description: "Whether the alert is currently firing"
      instance_count:
        type: integer
        description: "Number of firing instances"
      namespace:
        type: string
        enum: ["checkout", "payments", "production", "default", "openshift-monitoring"]
        description: "The namespace where the alert is firing"
    required: [is_firing, instance_count, namespace]
  expected:
    is_firing: true
    instance_count: 2
    namespace: "checkout"

- name: interpret_pod_oomkilled
  query: |
    You are investigating alert KubePodCrashLooping. The alert labels pointed to pod api-server-6f8b9c-xk2lm in namespace payments. You collected this pod evidence:
    {"pods":[{"name":"api-server-6f8b9c-xk2lm","namespace":"payments","phase":"Running","conditions":[{"type":"Ready","status":"False"},{"type":"ContainersReady","status":"False"}],"container_statuses":[{"name":"api","state":{"waiting":{"reason":"CrashLoopBackOff"}},"lastState":{"terminated":{"reason":"OOMKilled","exitCode":137,"finishedAt":"2026-07-17T08:15:00Z"}},"restartCount":12,"ready":false}],"node_name":"worker-2","restart_count":12,"events":[{"type":"Warning","reason":"BackOff","message":"Back-off restarting failed container api in pod api-server-6f8b9c-xk2lm_payments"}]}]}
    What is the root cause of this pod's failure?
  schema:
    type: object
    properties:
      root_cause:
        type: string
        enum: ["OOMKilled", "CrashLoopBackOff", "ImagePullBackOff", "Evicted", "NodeNotReady"]
        description: "The underlying cause of the container's termination."
      pod_name:
        type: string
        description: "The name of the affected pod"
      restart_count:
        type: integer
        description: "Number of container restarts"
    required: [root_cause, pod_name, restart_count]
  expected:
    root_cause: "OOMKilled"
    pod_name: "api-server-6f8b9c-xk2lm"
    restart_count: 12
